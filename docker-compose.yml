# Sobe o PontoEixo completo: banco PostgreSQL, API (FastAPI) e frontend (Next.js).
#
#   docker compose up --build
#
# Frontend: http://localhost:3000  ·  API e documentação: http://localhost:8000/docs
# Os valores abaixo podem ser trocados em um arquivo .env ao lado deste (veja .env.exemplo).

services:
  banco:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pontoeixo
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - dados_banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d pontoeixo"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      UrlBancoDados: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@banco:5432/pontoeixo
      PermissoesBackend: '["http://localhost:3000", "http://127.0.0.1:3000"]'
      ChaveSecretaJwt: ${CHAVE_SECRETA_JWT:-troque-esta-chave-em-producao-pontoeixo}
      # SMTP vazio: o código de recuperação de senha aparece no log (docker compose logs backend)
      SmtpServidor: ${SMTP_SERVIDOR:-}
      SmtpPorta: ${SMTP_PORTA:-587}
      SmtpUsuario: ${SMTP_USUARIO:-}
      SmtpSenha: ${SMTP_SENHA:-}
    ports:
      - "8000:8000"
    depends_on:
      banco:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Endereço da API visto pelo navegador (gravado no build do Next.js)
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  dados_banco:
