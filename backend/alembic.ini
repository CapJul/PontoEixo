# Configuração do Alembic (ferramenta de migrações do banco de dados).
#
# A URL do banco NÃO fica aqui: ela é lida de `app/core/config.py`
# (variável UrlBancoDados do arquivo .env) dentro de `migracoes/env.py`.
#
# Comandos mais usados (rodar dentro da pasta backend/):
#   alembic upgrade head                          -> aplica todas as migrações pendentes
#   alembic downgrade -1                          -> desfaz a última migração
#   alembic revision --autogenerate -m "mensagem" -> gera uma migração a partir dos modelos
#   alembic history                               -> lista as migrações existentes
#   alembic current                               -> mostra a versão atual do banco

[alembic]
# Pasta onde ficam o env.py e as versões das migrações
script_location = %(here)s/migracoes

# Padrão do nome dos arquivos de migração: 0001_criar_tabela_usuario.py
file_template = %%(rev)s_%%(slug)s

# Permite importar o pacote `app` a partir da pasta backend/
prepend_sys_path = .

# Separador de caminhos usado nas opções acima
path_separator = os

[post_write_hooks]

# Configuração de logs exibidos ao rodar os comandos do Alembic
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
